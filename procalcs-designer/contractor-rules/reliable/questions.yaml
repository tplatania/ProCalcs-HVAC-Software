# Question ledger — Reliable BOM learning loop
#
# Gerald's loop (2026-07-15): every corpus pass generates clarification
# questions; later passes close them with evidence or open new ones.
# Richard sees ONLY the stubborn tail, once, when the loop converges.
#
# Closure tiers (evidence bar — amendment 1):
#   closed-deterministic  exact mechanism, corpus-exact evidence
#   closed-documentary    an artifact in the corpus answers it
#   provisional           correlational answer — becomes a one-line
#                         CONFIRMATION for Richard, never silently closed
#   open                  unanswered, still corpus-answerable in principle
#   not-in-data           provably unanswerable from the archive → Richard
#
# Materiality rule (amendment 2): a question enters only if its answer
# changes BOM output. Stopping rule (amendment 3): loop converges when a
# pass closes 0 and opens 0 material questions.
#
# Passes: P0=20-pair pilot · P1=full-corpus run · P2=plan-memo +
# correlation pass (2026-07-15 overnight)


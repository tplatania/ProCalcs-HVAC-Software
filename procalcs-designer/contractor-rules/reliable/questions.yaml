  - id: q.revision_skew
    asked_in: P1
    question: "Why do 312 pairs have rup↔xls footage mismatch?"
    status: closed-deterministic
    closed_in: P4
    answer: >
      Revision skew confirmed: for 91/312 pairs a sibling rup revision
      in the same lot folder matches the xls footage EXACTLY
      (skew_recovery.json holds the mapping — those 91 are recovered
      ground truth). The remaining 221 have no matching revision in
      the archive — consistent with rups re-saved in place after
      export. Data-hygiene rule: score against recovered revisions
      where available; exclude the rest from ground truth.


  - id: q.takeoff_sku_generation
    asked_in: P1
    question: "Why do communities split between 040/050 and 041/051 takeoff SKUs?"
    status: closed-documentary
    closed_in: P5
    answer: >
      Rheia "Phase 2 HVAC design system" cutover, effective
      2022-07-01 (Pratt kickoff email, Park View Phase 2; Builders
      FirstSource re-engineering confirmation). Legacy communities
      (pre-cutover releases) carry 040/050; Phase-2 releases carry
      041/051. Digit mapping itself is corpus-inferred (exact on all
      1,076 pairs); the mechanism is documentary.

  - id: q.heat_strip_rule
    asked_in: P0
    question: "What sizes the electric heat strip (HKTSD05X1 on 79%)?"
    status: closed-expert
    closed_in: P2
    confirmed: 2026-07-29
    confirmed_by: "Richard (Reliable), via Gerald, Slack"
    expert_answer: >
      Verbatim: "There is no one rule for the heat strip. Really depends
      on the project, equipment type and client. The one heat strip per
      unit is general but not set in stone. There are equipment and
      projects that may not have heat strips at all."
    resolution: >
      Confirms the P2 hypothesis exactly. Engine policy (already in
      place, now expert-ratified): (1) trust the placed EQUIP strip —
      the designer's placement IS the per-project decision record;
      (2) NEVER inject a strip that isn't in the file; (3) where the
      count is ambiguous (79th Ct investment duplication, 4 vs
      Richard's 3), flag needs-verification instead of guessing —
      "1 per split system" is a sanity-check default, not a rule.
      For accuracy reporting: heat strips are a review-flagged class,
      excluded from auto-accuracy claims.
    answer_hypothesis: >
      Two-part: (a) the placed strip model is ALREADY in the .rup EQUIP
      block on 68% of pairs — copying it matches the xls 725/734
      (98.8%; the 9 misses are revision skew). (b) Where absent
      (Creekside/Pennyroyal/Park View era), kW varies 3–10 within the
      same tonnage — consistent with Manual-J heating-load sizing
      (loads not yet binary-decodable). Tonnage is NOT the rule
      (identical to always-5kW at 88.2%).
    confirmation_line: >
      "Legacy-era strips were field-corrected to builder spec (emails
      prove churn, no band table exists). One-liner for Richard:
      'Is there a standing kW-band rule today, or is the strip always
      per builder equipment spec?'"
    for_richard: >
      When a design file has no electric heat strip placed, what sizes
      it — is there a standing kW rule today, or is it always per the
      builder's equipment spec?
    note: >
      Engine action unchanged: copy strip from EQUIP when present;
      flag needs-input otherwise. P5 emails (Pippin/Pratt 2023-01)
      prove legacy variance was spec churn, not a decodable rule.

  - id: q.dehumidifier_trigger
    asked_in: P0
    question: "What decides a B33DHW dehumidifier on a lot (~45%, lot-level)?"
    status: closed-documentary
    closed_in: P5
    answer: >
      Beazer builder-spec revision, proven by email (Charles Pratt,
      Beazer Product Manager): 2025-02-07 "switch to the Goodman
      GZV6SA equipment across all communities" + test design "with
      the dehumidifier removed"; 2025-03-05 "for townhome communities
      only. The dehumidifier will be removed from all load calcs"
      (names Aulin Bldgs 2/4/5). CO1 predates the removal, CO2
      implements it; single-family communities never had it.
      Evidence: email_mining_report.md. NO Richard question needed.
    note: "Engine rule: B33DHW on townhome designs dated before 2025-03-05, not after." 

  - id: q.erv_exception
    asked_in: P0
    question: "Every plan gets a B150E75NT ERV unless ___? (B150E75NS seen once)"
    status: closed-deterministic
    closed_in: P4
    answer: >
      NS is the legacy-era variant: appears ONLY in the three
      older-era communities (Pennyroyal 84, Creekside 29, Park View
      14 of 1,076 pairs) — the same era cluster as the 040/050
      takeoff SKUs and absent strip records. Rule: emit NT (current
      generation); the community era-map covers legacy.

